[project]
name = "zood-blog"
version = "0.2.0"
description = "A small static personal blog generator and development server."
requires-python = ">=3.8"
dependencies = [
    "MarkdownParser>=0.5.39,<0.6",
    "syntaxlight>=0.1.62,<0.2",
]

[project.scripts]
zood-blog = "build:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["build"]
