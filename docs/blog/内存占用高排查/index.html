            <div class="header-navigator"><ul><li><a href="#h1-0">内存占用高排查</a></li></ul></div><div class='markdown-body'><h1 id="h1-0">内存占用高排查</h1><p>查询剩余内存</p><pre class="language-shell"><code><span class="Token ID">free</span><span class="Token SPACE"> </span><span class="Token OPTION">-h</span></code></pre><p>查询所有进程中占用内存高的</p><pre class="language-shell"><code><span class="Token ID">ps</span><span class="Token SPACE"> </span><span class="Token ID">aux</span><span class="Token SPACE"> </span><span class="Token OPTION">--sort</span><span class="Token ASSIGN">=</span><span class="Token MINUS">-</span><span class="Token MOD">%</span><span class="Token ID">mem</span><span class="Token SPACE"> </span><span class="Token PIPE">|</span><span class="Token SPACE"> </span><span class="Token ID">head</span></code></pre><p>查询所有用户占用内存情况</p><pre class="language-shell"><code><span class="Token Program ID">sudo</span><span class="Token SPACE"> </span><span class="Token ID">smem</span><span class="Token SPACE"> </span><span class="Token OPTION">-r</span><span class="Token SPACE"> </span><span class="Token OPTION">-k</span><span class="Token SPACE"> </span><span class="Token OPTION">-u</span></code></pre><p>通常来说可能是一个使用 <kbd>ctrl</kbd> + <kbd>z</kbd> 暂停的进程, 找到 kill 掉即可</p></div>
